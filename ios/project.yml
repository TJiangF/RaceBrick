name: RaceBrick
options:
  bundleIdPrefix: cn.tfworks
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  RaceBrickCore:
    path: RaceBrickCore
targets:
  RaceBrick:
    type: application
    platform: iOS
    sources:
      - path: RaceBrick
        excludes:
          - Info.plist
    resources:
      - path: RaceBrick/Assets.xcassets
    dependencies:
      - package: RaceBrickCore
        product: RaceBrickCore
    settings:
      base:
        INFOPLIST_FILE: RaceBrick/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: cn.tfworks.racebrick
        PRODUCT_NAME: RaceBrick
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
