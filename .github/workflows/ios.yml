name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and build (simulator)
        working-directory: ios
        run: |
          set -o pipefail
          {
            xcodebuild -version
            xcodebuild -showsdks
            xcodebuild -project RaceBrick.xcodeproj -list
            xcodebuild -project RaceBrick.xcodeproj -scheme RaceBrick \
              -configuration Debug -sdk iphonesimulator \
              -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          } 2>&1 | tee /tmp/ios-build.log
      - name: Build device binary without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project RaceBrick.xcodeproj -scheme RaceBrick \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/ios-device.log
      - name: Publish build errors
        if: failure()
        run: |
          echo "::error title=iOS build failed::$(grep -E 'error:' /tmp/ios-build.log /tmp/ios-device.log 2>/dev/null | tail -40 | tr '\n' ' ' | sed 's/%/%25/g')"
          {
            echo '## iOS build errors'
            echo '```'
            grep -E 'error:|note:' /tmp/ios-build.log /tmp/ios-device.log 2>/dev/null | tail -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "run=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "--- simulator build ---"
            grep -E 'error:|note:' /tmp/ios-build.log 2>/dev/null | tail -80
            echo "--- device build ---"
            grep -E 'error:|note:' /tmp/ios-device.log 2>/dev/null | tail -80
          } > ios-build-error.log
          git config user.name "RaceBrick CI"
          git config user.email "ci@tfworks.cn"
          git checkout -B "ci-ios-$GITHUB_RUN_ID"
          git add -f ios-build-error.log
          git commit -m "iOS CI diagnostics $GITHUB_RUN_ID" || true
          git push origin "HEAD:refs/heads/ci-ios-$GITHUB_RUN_ID"
      - name: Package simulator app
        working-directory: ios
        run: |
          mkdir -p artifacts
          APP=$(find build -name 'RaceBrick.app' -type d | head -1)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/RaceBrick-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RaceBrick-iOS-simulator
          path: ios/artifacts/RaceBrick-simulator.zip
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            /tmp/ios-build.log
            /tmp/ios-device.log
