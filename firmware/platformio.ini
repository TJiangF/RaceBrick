; PlatformIO Project Configuration File
; RaceBrick firmware — ESP32-S3 + ST7789 (240x360) + pixel UI (no LVGL)
; Web reference implementation: https://github.com/TJiangF/RaceBrick (branch main)

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -Wall
  -Wno-error
  -Wno-format-truncation
  -Wno-misleading-indentation
  -Wno-unused-variable
  -Wno-unused-function
