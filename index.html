<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaceChrono UI · Web Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="deviceWrap">
      <div id="deviceScaler">
        <div id="device">
          <div id="ledBar"></div>
          <div id="stage"></div>
          <div id="statusBar"></div>
          <div id="toastHost"></div>
        </div>
      </div>
      <div id="buttons">
        <button class="hwbtn" data-btn="Up">UP</button>
        <button class="hwbtn" data-btn="Down">DOWN</button>
        <button class="hwbtn wide" data-btn="Push">PUSH</button>
        <button class="hwbtn wide" data-btn="Ok">OK</button>
        <button class="hwbtn wide" data-btn="Back">BACK</button>
      </div>
      <div class="legend">
        keyboard: ↑/↓ Up·Down &nbsp;|&nbsp; Enter Ok &nbsp;|&nbsp; Space Push &nbsp;|&nbsp; Esc Back<br>
        hold any key ≥600ms = long press
      </div>
    </div>

    <div id="panel">
      <h2>RACECHRONO DEBUG</h2>
      <div class="kv"><span>state</span><span id="dbgState">-</span></div>
      <div class="kv"><span>held</span><span id="dbgHeld">-</span></div>
      <div class="kv"><span>race</span><span id="dbgRace">-</span></div>

      <div class="row">
        <span style="color:#6f747c">sim speed</span>
        <button data-speed="0.5">0.5x</button>
        <button data-speed="1" class="active">1x</button>
        <button data-speed="2">2x</button>
        <button data-speed="4">4x</button>
        <span id="dbgSpeed" style="color:#fff">1x</span>
      </div>
      <div class="row">
        <span style="color:#6f747c">zoom</span>
        <button data-zoom="1">1x</button>
        <button data-zoom="1.5">1.5x</button>
        <button data-zoom="2" class="active">2x</button>
        <button data-zoom="3">3x</button>
      </div>
      <div class="row">
        <button id="dbgInject">快进到圈末</button>
        <button id="dbgHome">回到 HOME</button>
      </div>

      <h2>GPIO MAP (reserved)</h2>
      <pre id="dbgGpio"></pre>

      <h2>EVENT LOG</h2>
      <div id="dbgLog"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/input.js"></script>
  <script src="js/track.js"></script>
  <script src="js/gnss.js"></script>
  <script src="js/imu.js"></script>
  <script src="js/map.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* debug + on-screen-button wiring (runs after app.js boots) */
    window.addEventListener('DOMContentLoaded', function () {
      var app = window.RC.app;
      var D = window.RC.DOM;

      /* hardware buttons */
      document.querySelectorAll('.hwbtn').forEach(function (el) {
        var id = el.getAttribute('data-btn');
        var down = function (e) {
          e.preventDefault();
          app.buttonDown(id);
          el.classList.add('pressed');
        };
        var up = function () {
          app.buttonUp(id);
          el.classList.remove('pressed');
        };
        el.addEventListener('pointerdown', down);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointerleave', up);
        el.addEventListener('pointercancel', up);
      });

      /* sim speed */
      document.querySelectorAll('[data-speed]').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('[data-speed]').forEach(function (x) {
            x.classList.remove('active');
          });
          b.classList.add('active');
          app.setSimSpeed(parseFloat(b.getAttribute('data-speed')));
        });
      });

      /* zoom */
      var z = 2;
      function setZoom(v) {
        z = v;
        var dev = document.getElementById('device');
        var sc = document.getElementById('deviceScaler');
        dev.style.transformOrigin = 'top left';
        dev.style.transform = 'scale(' + v + ')';
        sc.style.width = 360 * v + 'px';
        sc.style.height = 240 * v + 'px';
      }
      document.querySelectorAll('[data-zoom]').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('[data-zoom]').forEach(function (x) {
            x.classList.remove('active');
          });
          b.classList.add('active');
          setZoom(parseFloat(b.getAttribute('data-zoom')));
        });
      });
      setZoom(2);

      /* actions */
      document.getElementById('dbgInject').addEventListener('click', function () {
        if (app.engine) app.engine.completeLap();
        app.toast('已注入一圈');
      });
      document.getElementById('dbgHome').addEventListener('click', function () {
        app.goHomeTo(0);
      });

      /* gpio map */
      document.getElementById('dbgGpio').textContent = JSON.stringify(
        window.RC.CONFIG.GPIO,
        null,
        1
      );
    });
  </script>
</body>
</html>
